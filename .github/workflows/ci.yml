# T3.7: testy i lint przy kazdym pushu na dev/main i w kazdym PR.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: pytest
        run: pytest -q -p no:cacheprovider
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: node --check (moduly ES)
        run: for f in frontend/js/*.js frontend/js/views/*.js frontend/js/locales/*.js frontend/sw.js; do node --check "$f"; done
      - name: tlumaczenia PL/EN (scripts/check_i18n.mjs)
        run: node scripts/check_i18n.mjs
